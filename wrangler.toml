# wrangler.toml — Cloudflare Pages configuration
#
# Deploy: wrangler pages deploy .output/public --project-name seo-blog-generator
#
# IMPORTANT: After running `wrangler kv namespace create BLOGS`, paste the
# returned id below (and the preview_id from `wrangler kv namespace create BLOGS --preview`).
# Never commit secrets — set them with `wrangler pages secret put <NAME>`.

name = "seo-blog-generator"
pages_build_output_dir = ".output/public"

# nodejs_compat enables node:zlib (used by the compress middleware),
# node:buffer, node:crypto, and other Node.js built-ins in the Workers runtime.
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ── KV namespace ─────────────────────────────────────────────────────────────
# Create with: wrangler kv namespace create BLOGS
# Preview:     wrangler kv namespace create BLOGS --preview
[[kv_namespaces]]
binding = "BLOGS"
id = "2c75f156189542c583a9d2d9184fce24"
preview_id = "6c8b4b9ea9ee4c628a8f960a90755410"

# ── Non-secret environment variables ─────────────────────────────────────────
# Secrets (GEMINI_API_KEY, ADMIN_PASSWORD) must be set via:
#   wrangler pages secret put GEMINI_API_KEY --project-name seo-blog-generator
#   wrangler pages secret put ADMIN_PASSWORD --project-name seo-blog-generator
[vars]
NUXT_PUBLIC_SITE_URL = "https://seo-blog-generator-772.pages.dev"
LLM_PROVIDER = "gemini"
NITRO_PRESET = "cloudflare-pages"
